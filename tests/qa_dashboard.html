<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>QA</title></head>
<body>
<!--
  Headless QA harness for the dashboard.  It loads the real dashboard in an iframe, drives the
  controls the way a user would, and writes a machine-readable summary into
  the document so `chrome --headless --dump-dom` can assert on it.
  This file is a test fixture, not part of the published site.
-->
<iframe id="app" src="../dashboard/index.html" style="width:1400px;height:1200px;border:0"></iframe>
<pre id="out">pending</pre>
<script>
var frame = document.getElementById("app");
var tries = 0;

function publish(obj) {
  var text = "QA_RESULT " + JSON.stringify(obj);
  document.getElementById("out").textContent = text;
  document.title = text;
}

function fire(el) { el.dispatchEvent(new Event("change", { bubbles: true })); }
function txt(node) { return node.textContent.replace(/\s+/g, " ").trim(); }

function run(d, w) {
  var results = {};
  function setSelect(id, value) {
    var el = d.getElementById(id);
    el.value = value;
    fire(el);
  }

  results.defaultFacts = txt(d.getElementById("modelFacts"));

  // the DEFAULT state: the map opens on the 2026 prediction, cotton, and
  // absolute yield
  results.defaultSeason = d.getElementById("seasonSelect").value;
  results.defaultMetric = d.getElementById("metricSelect").value;
  results.defaultCrop = d.getElementById("cropSelect").value;
  results.defaultMapNote = txt(d.getElementById("mapNote"));
  results.defaultReadNote = txt(d.getElementById("readNote"));
  results.seasonOptions = Array.prototype.map.call(
    d.getElementById("seasonSelect").options, function (o) { return o.textContent.trim(); }
  );
  results.mapLabelsPredicted = d.querySelectorAll("#map .district-label").length;
  results.mapNoteOnPrediction = results.defaultMapNote;

  // the season readout's two charts carry the 2026 point, dashed
  results.rainDashed = d.querySelectorAll(
    "#rainChart .js-line[style*='dash']"
  ).length;
  results.yieldDashed = d.querySelectorAll(
    "#yieldChart .js-line[style*='dash']"
  ).length;
  results.rainLastCategory = (function () {
    var t = Array.prototype.map.call(
      d.querySelectorAll("#rainChart .xtick text"), function (x) { return x.textContent; }
    );
    return t[t.length - 1];
  })();
  results.yieldLastCategory = (function () {
    var t = Array.prototype.map.call(
      d.querySelectorAll("#yieldChart .xtick text"), function (x) { return x.textContent; }
    );
    return t[t.length - 1];
  })();

  // the state summary: five rows, 2026 and the state average under the crop
  results.summaryRows = d.querySelectorAll("#stateSummary tbody tr").length;
  results.summaryHeaders = Array.prototype.map.call(
    d.querySelectorAll("#stateSummary thead th"), function (th) { return txt(th); }
  );
  results.summaryCrops = Array.prototype.map.call(
    d.querySelectorAll("#stateSummary tbody th"), function (th) { return txt(th); }
  );
  results.summaryValues = Array.prototype.map.call(
    d.querySelectorAll("#stateSummary tbody tr"),
    function (tr) {
      return Array.prototype.map.call(tr.children, function (td) { return txt(td); });
    }
  );
  results.summaryDeltas = d.querySelectorAll("#stateSummary .state-summary__delta").length;
  results.summaryNote = txt(d.getElementById("stateSummaryNote"));

  // the crop selector and the model facts follow the selected crop
  setSelect("cropSelect", "Rice");
  results.riceFacts = txt(d.getElementById("modelFacts"));

  setSelect("cropSelect", "Wheat");
  results.wheatFacts = txt(d.getElementById("modelFacts"));

  setSelect("cropSelect", "Cotton(lint)");
  setSelect("seasonSelect", "2018-19");
  results.mapNote = txt(d.getElementById("mapNote"));

  // the map metric drives the legend
  setSelect("metricSelect", "yield");
  results.legendAfterMetric = txt(d.getElementById("legendScale"));
  setSelect("metricSelect", "deficit");
  results.legendAfterDeficit = txt(d.getElementById("legendScale"));
  results.legendCaptionDeficit = txt(d.getElementById("legendCaption"));
  setSelect("metricSelect", "anomaly");

  results.leafletPaths = d.querySelectorAll("#map path").length;
  results.mapLabels = d.querySelectorAll("#map .district-label").length;
  results.statsPlot = d.querySelectorAll("#statsChart svg").length;
  results.statsBars = d.querySelectorAll("#statsChart .barlayer path").length;

  // the window-sensitivity panel
  results.windowHeadCells = d.querySelectorAll("#windowTable thead th").length;
  results.windowBodyRows = d.querySelectorAll("#windowTable tbody tr").length;
  results.windowFoot = txt(d.getElementById("windowFoot"));
  results.windowFirstRow = txt(d.querySelector("#windowTable tbody tr"));
  results.cropOptions = d.getElementById("cropSelect").options.length;
  results.cropOptionTexts = Array.prototype.map.call(
    d.getElementById("cropSelect").options, function (o) { return o.textContent.trim(); }
  );

  // the crop identity strip (SRS §7.1, Okabe-Ito): one fixed colour per crop
  results.cropChips = d.querySelectorAll("#cropStrip .cropchip").length;
  // the browser normalises a hex set via style.background into rgb(), so the
  // comparison is made on the rgb() form
  results.cropChipColors = Array.prototype.map.call(
    d.querySelectorAll("#cropStrip .cropchip__swatch"),
    function (s) { return s.style.background; }
  );
  results.cropChipActive = d.querySelectorAll("#cropStrip .cropchip--on").length;

  // the 2016 boundary discontinuity must be visible on the map itself
  results.boundaryNote = txt(d.getElementById("mapBoundaryNote"));
  results.boundaryNoteShown = !!(
    d.getElementById("mapBoundaryNote") &&
    d.getElementById("mapBoundaryNote").offsetParent !== null
  );

  // the 2026 implied-yield band, published for rice only
  var bundle = frame.contentWindow.TA_DATA || {};
  var mk = bundle.marker || {};
  results.impliedForRice = !!(mk.implied_by_crop && mk.implied_by_crop["Rice"]);
  results.impliedWithheld = mk.implied_withheld ?
    Object.keys(mk.implied_withheld).length : -1;

  /* ── the forecast chart: ONE chart, with a crop selector ─────────────── */

  // the retired sections must be gone
  results.curveSectionPresent = !!d.getElementById("curveChart");
  results.curveHeadingPresent = !!d.getElementById("curveHead");
  results.districtTablePresent = !!d.getElementById("districtTable");
  results.districtTableHeadPresent = !!d.getElementById("tableHead");
  results.forecastGridPresent = !!d.getElementById("forecastGrid");

  // one chart
  results.forecastPlots = d.querySelectorAll("#forecastChart .plot-container").length;
  results.forecastSvgs = d.querySelectorAll("#forecastChart svg.main-svg").length;

  // the selector: "All" plus one tick per crop
  results.tickButtons = d.querySelectorAll("#forecastTicks .forecast-tick").length;
  results.tickAllText = txt(d.querySelector("#forecastTicks .forecast-tick--all"));
  results.ticksOn = d.querySelectorAll("#forecastTicks .forecast-tick--on").length;
  results.tickPressed = d.querySelectorAll('#forecastTicks .forecast-tick[aria-pressed="true"]').length;

  // the x axis: nine observed seasons and then 2026, as the LAST category
  var ticks = Array.prototype.map.call(
    d.querySelectorAll("#forecastChart .xtick text"),
    function (x) { return x.textContent; }
  );
  results.forecastXLabels = ticks;
  results.forecastLastCategory = ticks.indexOf("2026-27") === ticks.length - 1;
  results.forecastSeasonCount = ticks.length;

  // the 2026 segment must be dashed, one per crop
  results.forecastDashed = d.querySelectorAll(
    "#forecastChart .js-line[style*='dash']"
  ).length;

  // the reference line at 100 and the boundary divider
  results.forecastShapes = d.querySelectorAll("#forecastChart .shapelayer path").length;

  // the legend explains the marks
  results.forecastLegendItems = d.querySelectorAll("#forecastLegend .forecast-legend__item").length;
  results.forecastFoot = txt(d.getElementById("forecastFoot"));
  results.forecastLegendText = txt(d.getElementById("forecastLegend"));

  /* ── the crop selector drives the chart ─────────────────────────────── */

  // untick one crop: only that crop's line is left
  var riceTick = d.querySelector('#forecastTicks .forecast-tick[data-crop="Rice"]');
  if (riceTick) riceTick.click();
  results.afterUntickOn = d.querySelectorAll("#forecastTicks .forecast-tick--on").length;
  results.afterUntickAll = d.querySelectorAll("#forecastTicks .forecast-tick--all.forecast-tick--on").length;
  results.afterUntickLines = d.querySelectorAll("#forecastChart .js-line").length;
  results.afterUntickPoints = d.querySelectorAll("#forecastChart .points path").length;
  results.afterUntickLegend = txt(d.getElementById("forecastLegend"));

  // the "All" button ticks every crop back on
  var allTick = d.querySelector("#forecastTicks .forecast-tick--all");
  if (allTick) allTick.click();
  results.afterAllOn = d.querySelectorAll("#forecastTicks .forecast-tick--on").length;
  results.afterAllAll = d.querySelectorAll("#forecastTicks .forecast-tick--all.forecast-tick--on").length;
  results.afterAllLines = d.querySelectorAll("#forecastChart .js-line").length;

  // arhar carries one delivered outlier (Mulugu 2019-20) that must not be
  // allowed to set the scale, and must be reported in the foot
  var arharTick = d.querySelector('#forecastTicks .forecast-tick[data-crop="Arhar/Tur"]');
  if (arharTick) arharTick.click();
  results.arharFoot = txt(d.getElementById("forecastFoot"));
  results.arharLines = d.querySelectorAll("#forecastChart .js-line").length;
  results.arharYLabels = Array.prototype.map.call(
    d.querySelectorAll("#forecastChart .ytick text"),
    function (x) { return x.textContent; }
  );
  results.arharOn = d.querySelectorAll("#forecastTicks .forecast-tick--on").length;
  if (allTick) allTick.click();

  /* ── the retired sections ────────────────────────────────────────────── */

  results.forecastDistrictTablePresent = !!d.getElementById("forecastTable");
  results.disclosureListPresent = !!d.getElementById("disclosureList");
  results.colophonPresent = !!d.querySelector("footer.colophon");
  results.disclaimerBoxPresent = !!d.getElementById("markerDisclaimer");
  results.forecastTableHead = txt(d.getElementById("forecastTableHead"));
  results.summaryDeltasDown = d.querySelectorAll(
    "#stateSummary .diff-cell--down"
  ).length;
  results.summaryDeltasUp = d.querySelectorAll(
    "#stateSummary .diff-cell--up"
  ).length;
  results.summarySignsPrinted = Array.prototype.every.call(
    d.querySelectorAll("#stateSummary .state-summary__delta"),
    function (c) { return /[\u2191\u2193]/.test(c.textContent); }
  );

  /* ── the point-description panel ─────────────────────────────────────── */

  results.detailPanelPresent = !!d.getElementById("forecastDetailBody");
  results.detailFields = 0;
  // the 2026 diamond on the forecast chart opens the reading; the district
  // table that used to do it is retired
  // The 2026 diamond on the forecast chart opens the reading.  The district
  // table that used to do it is retired, so the trigger is the chart: the
  // real hover machinery is asked for the 2026 point, and the click event
  // Plotly emits on a click is emitted with that hover data.
  var gd = d.getElementById("forecastChart");
  var w = frame.contentWindow;
  var curve = -1, pIdx = -1;
  (gd.data || []).forEach(function (tr, i) {
    if (curve < 0 && tr.marker && tr.marker.symbol === "diamond") {
      curve = i;
      pIdx = (tr.x || []).indexOf("2026-27");
    }
  });
  results.detailCurve = curve;
  if (curve >= 0 && w.Plotly && w.Plotly.Fx && gd.emit) {
    w.Plotly.Fx.hover(gd, [{ curveNumber: curve, pointNumber: pIdx }]);
    if (gd._hoverdata) {
      gd.emit("plotly_click", { points: gd._hoverdata, event: null });
    }
  }
  results.detailFields = d.querySelectorAll("#forecastDetailBody > div").length;
  results.detailFields = d.querySelectorAll("#forecastDetailBody > div").length;
  results.detailHasRainfall = d.getElementById("forecastDetailBody")
    ? /rainfall/.test(d.getElementById("forecastDetailBody").textContent) : false;
  results.detailHasAreaBaseline = d.getElementById("forecastDetailBody")
    ? /2022-23/.test(d.getElementById("forecastDetailBody").textContent) : false;

  publish(results);
}

var iv = setInterval(function () {
  tries++;
  try {
    var d = frame.contentDocument;
    if (d && d.getElementById("forecastChart") &&
        d.querySelectorAll("#forecastChart svg.main-svg").length > 0 &&
        d.querySelectorAll("#forecastTicks .forecast-tick").length > 0 &&
        d.querySelectorAll("#stateSummary tbody tr").length > 0) {
      clearInterval(iv);
      run(d, frame.contentWindow);
    } else if (tries > 300) {
      clearInterval(iv);
      var diag = { error: "timeout waiting for the app to render" };
      try {
        var dd = frame.contentDocument;
        diag.hasBundle = typeof dd.defaultView.TA_DATA;
        diag.hasGeo = typeof dd.defaultView.TA_GEO;
        diag.cropOptions = dd.getElementById("cropSelect") ?
          dd.getElementById("cropSelect").options.length : -1;
        diag.ticks = dd.querySelectorAll("#forecastTicks .forecast-tick").length;
        diag.forecastPlots = dd.querySelectorAll("#forecastChart .plot-container").length;
        diag.forecastSvgs = dd.querySelectorAll("#forecastChart svg").length;
        diag.plots = dd.querySelectorAll(".js-plotly-plot").length;
        diag.mapPaths = dd.querySelectorAll("#map path").length;
        diag.bodyStart = dd.body.textContent.replace(/\s+/g, " ").trim().slice(0, 200);
      } catch (e) { diag.inner = String(e); }
      publish(diag);
    }
  } catch (e) {
    if (tries > 300) { clearInterval(iv); publish({ error: String(e) }); }
  }
}, 50);
</script>
</body>
</html>
